# Batch status runs, one CronJob per jurisdiction. Each run is an Indexed Job: every pod gets
# JOB_COMPLETION_INDEX and checks only the returns whose hash falls in its shard, so a run
# scales out by raising completions/parallelism (and BATCH_SHARDS to match).
#
# The demo runs every minute. Production would run a few times a day per agency, timed to
# just after each agency's own status update cycle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-federal
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid       # never overlap runs for the same agency
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completionMode: Indexed
      completions: 2
      parallelism: 2
      backoffLimit: 2
      activeDeadlineSeconds: 50
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: batch
            tax-refund/db-client: "true"
            tax-refund/agency-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: batch
              image: tax-refund-backend
              imagePullPolicy: IfNotPresent
              args: ["batch-run", "federal"]
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: app-secrets
              env:
                - name: BATCH_SHARDS
                  value: "2"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { memory: 128Mi }
---
