apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # Stateless: sessions live in Postgres, so any replica can serve any request.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        tax-refund/db-client: "true"
        tax-refund/agency-client: "true"   # admin UI changes statuses at the mock agencies
    spec:
      automountServiceAccountToken: false
      securityContext: &podSecurity
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migrations take a Postgres advisory lock, so concurrent pods are safe.
        - name: migrate
          image: tax-refund-backend
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom: &env
            - configMapRef:
                name: backend-config
            - secretRef:
                name: app-secrets
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &resources
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      containers:
        - name: api
          image: tax-refund-backend
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          envFrom: *env
          env:
            - name: MIGRATE_ON_START
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext: *containerSecurity
          resources: *resources
