# Jaeger all-in-one with in-memory storage: fine for a demo, traces are lost on restart.
# Production would run the OpenTelemetry Collector (with tail sampling) in front of Jaeger
# backed by Elasticsearch/OpenSearch or Cassandra.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.6.0
          env:
            - name: JAEGER_LISTEN_HOST
              value: 0.0.0.0
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
